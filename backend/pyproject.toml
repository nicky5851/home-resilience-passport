[project]
name = "hrp-backend"
version = "0.1.0"
description = "Home Resilience Passport API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "fastapi-users>=15",
    "anthropic>=2.3.0",
    "scikit-learn>=1.9.1",
    "pandas>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.23.1",
    "ruff>=0.7",
]
ml = [
    "matplotlib>=3.11.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
